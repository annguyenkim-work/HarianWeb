name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NewHarian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore NewHarian.slnx
      - run: dotnet build NewHarian.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/NewHarian.UnitTests/NewHarian.UnitTests.csproj -c Release --no-build --verbosity normal
      - name: Integration tests
        run: dotnet test tests/NewHarian.Web.Tests/NewHarian.Web.Tests.csproj -c Release --no-build --verbosity normal

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: NewHarian
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_CONNECTION_STRING: "Host=localhost;Port=5432;Database=newharian_e2e;Username=postgres;Password=postgres"
      E2E_REQUIRED: "true"
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/e2e-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore tests/NewHarian.E2E/NewHarian.E2E.csproj
      - run: dotnet build tests/NewHarian.E2E/NewHarian.E2E.csproj -c Release --no-restore
      - name: Install Playwright Chromium
        run: pwsh tests/NewHarian.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: E2E tests (Playwright + Postgres)
        run: >
          dotnet test tests/NewHarian.E2E/NewHarian.E2E.csproj
          -c Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=e2e.trx"
          --results-directory "${{ github.workspace }}/e2e-artifacts/results"
      - name: Upload Playwright traces / screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            ${{ github.workspace }}/e2e-artifacts
            !${{ github.workspace }}/e2e-artifacts/auth
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: deploy
    needs: [build-and-test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: NewHarian
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: >
          dotnet publish src/NewHarian.Web/NewHarian.Web.csproj
          -c Release
          -r linux-x64
          --self-contained false
          -o ./publish

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}" || { echo "Missing secret DEPLOY_SSH_KEY"; exit 1; }
          test -n "${DEPLOY_HOST}" || { echo "Missing secret DEPLOY_HOST"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync publish folder to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          REMOTE_PATH="${DEPLOY_PATH:-/var/www/myweb}"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${PORT} -o StrictHostKeyChecking=yes" \
            --exclude 'App_Data/' \
            --exclude 'wwwroot/uploads/' \
            ./publish/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_PATH}/"

      - name: Restart service and health-check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SERVICE: ${{ secrets.DEPLOY_SERVICE }}
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          SERVICE="${DEPLOY_SERVICE:-myweb.service}"
          ssh -i ~/.ssh/id_ed25519 -p "$PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo systemctl restart ${SERVICE} && sudo systemctl --no-pager --full status ${SERVICE}"
          if [ -n "${HEALTH_URL:-}" ]; then
            sleep 3
            curl -fsS "$HEALTH_URL" | tee /tmp/health.json
          fi
