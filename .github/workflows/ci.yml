name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NewHarian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore tests/NewHarian.Web.Tests/NewHarian.Web.Tests.csproj
      - run: dotnet build tests/NewHarian.Web.Tests/NewHarian.Web.Tests.csproj -c Release --no-restore
      - run: dotnet test tests/NewHarian.Web.Tests/NewHarian.Web.Tests.csproj -c Release --no-build --verbosity normal
